<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFlow - Главная</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>
            <a href="index.html">MeshFlow</a>
        </h1>
        <nav class="nav-section">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" style="text-decoration: underline;">Главная</a></li>
                <li class="nav-item"><a href="new-post.html">Новый пост</a></li>
                <li class="nav-item"><a href="index.html">О нас</a></li>
            </ul>
        </nav>
        <div class="profile-section">
            <div class="profile-name">
                <span>Профиль</span>
                <a href="login.html" id="auth-link">Войти</a>
            </div>
            <div class="profile-icon" id="profile-icon">
                MF
            </div>
            <div class="profile-dropdown" id="profile-dropdown">
                <strong>Профиль</strong>
                <span id="profile-email">Пока тут пусто...</span>
                <button class="logout-btn" id="logout-btn">Выйти</button>
                <button class="auth-btn" id="auth-btn">Войти</button>
            </div>
        </div>
    </header>
    <main>
        <form class="search-section" role="search">
            <input type="text" class="search-bar" placeholder="Поиск постов...">
            <button type="submit" class="search-btn">Найти</button>
        </form>
        <section class="feed-section">
            <section class="create-post">
                <textarea placeholder="Что у вас нового?"></textarea>
                <button>Опубликовать</button>
            </section>
            <section class="posts-list" id="post-list">
                <h2>Лента рекомендаций</h2>
            </section>
            
        </section>
    </main>
    <footer>
        <span>© 2026 MeshFlow</span>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
