<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFlow - Главная</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <span>MeshFlow</span>
        <nav class="nav-section">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html">Главная</a></li>
                <li class="nav-item"><a href="index.html">Профиль</a></li>
                <li class="nav-item"><a href="index.html">О нас</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form class="search-section" role="search">
            <input type="text" class="search-bar" placeholder="Поиск постов...">
            <button type="submit" class="search-btn">Найти</button>
        </form>
        <section class="feed-section">
            <section class="create-post">
                <textarea placeholder="Что у вас нового?"></textarea>
                <button>Опубликовать</button>
            </section>
            <h2>Лента рекомендаций</h2>
            <section class="posts-list">
                <article class="post">
                    Разработчики выкатили обновление механики стрельбы. Делитесь первыми впечатлениями в комментариях!
                </article>
            </section>
            
        </section>
    </main>
    <footer>
        <span>© 2026 MeshFlow</span>
    </footer>
</body>
</html>
