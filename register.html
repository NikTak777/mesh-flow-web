<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFlow - регистрация</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main>
        <div class="login-section">
            <h2> <a href="index.html">MeshFlow</a> ● Создание аккаунта</h2>
            <form id="register-form">
                <label for="email-input">Электронная почта</label>
                <input type="email" id="email-input" placeholder="Введите адрес эл. почты" autocomplete>
                <label for="login-input">Логин (его будут видеть пользователи)</label>
                <input type="text" id="login-input" placeholder="Введите логин" autocomplete>
                <label for="password-input">Пароль</label>
                <input type="password" id="password-input" placeholder="Введите пароль">
                <label for="confirm-input">Подтверждение пароля</label>
                <input type="password" id="confirm-input" placeholder="Подтвердите пароль">
                <div class="button-group">
                    <button type="submit">Зарегистрироваться</button>
                    <button type="button" class="back-btn" id="back-btn">Назад на главную</button>
                </div>
            </form>
            <div class="login-footer">
                <span>Уже регистрировались?</span>
                <a href="login.html">Войдите в аккаунт</a>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
