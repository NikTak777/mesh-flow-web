<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFlow - вход</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main>
        <div class="login-section">
            <h2> <a href="index.html">MeshFlow</a> ● Вход в аккаунт</h2>
            <form id="login-form">
                <label for="email-input">Электронная почта</label>
                <input type="email" id="email-input" placeholder="Введите адрес эл. почты" autocomplete>
                <label for="password-input">Пароль</label>
                <input type="password" id="password-input" placeholder="Введите пароль">
                <div class="button-group">
                    <button type="submit">Войти</button>
                    <button type="button" class="back-btn" id="back-btn">Назад на главную</button>
                </div>
            </form>
            <div class="login-footer">
                <span>Нет аккаунта? Время для </span>
                <a href="register.html">регистрации</a>
            </div>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
