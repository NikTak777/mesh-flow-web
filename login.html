<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFlow - вход</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main>
        <div class="login-section">
            <a href="index.html">MeshFlow</a>
            <h2>Вход в аккаунт</h2>
            <form>
                <label for="email-input">Электронная почта</label>
                <input type="text" type="email" id="email-input" placeholder="Введите адрес эл. почты" autocomplete>
                <label for="password-input">Пароль</label>
                <input type="text" type="password" id="password-input" placeholder="Введите пароль">
                <button type="submit">Войти</button>
            </form>
        </div>
    </main>
</body>
</html>
